[package]
name = "helmp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Helmp — a native macOS launcher with an agent switcher"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = "=0.9.0"
global-hotkey = "0.9.0"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSDateFormatter", "NSDictionary", "NSError", "NSFormatter", "NSGeometry", "NSLocale", "NSString", "NSURL", "block2", "NSBundle", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSBezierPath", "NSBitmapImageRep", "NSColor", "NSGraphics", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "block2", "objc2-core-foundation", "objc2-core-graphics", "NSAlert", "NSButton", "NSControl", "NSEvent", "NSFont", "NSImageView", "NSMenu", "NSMenuItem", "NSMenuItemBadge", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSText", "NSTextField", "NSDragging", "NSDraggingItem", "NSDraggingSession"] }
raw-window-handle = "0.6.2"
block2 = "0.6.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "objc2-core-foundation"] }
notify = "8.2.1"
pinyin = { version = "0.11.0", default-features = false, features = ["plain", "heteronym"] }
plist = { version = "1.10.3", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.1", features = ["json"] }
security-framework = "3.7.0"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
