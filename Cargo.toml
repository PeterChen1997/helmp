[package]
name = "helmp"
version = "0.4.2"
edition = "2024"
rust-version = "1.99"
description = "Helmp — a native macOS launcher with an agent switcher"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = "=0.9.0"
global-hotkey = "0.9.0"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSDateFormatter", "NSDictionary", "NSError", "NSFormatter", "NSGeometry", "NSLocale", "NSString", "NSURL", "block2", "NSBundle", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSBezierPath", "NSBitmapImageRep", "NSColor", "NSGraphics", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "block2", "objc2-core-foundation", "objc2-core-graphics", "NSAlert", "NSButton", "NSControl", "NSEvent", "NSFont", "NSImageView", "NSMenu", "NSMenuItem", "NSMenuItemBadge", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSText", "NSTextField", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSGlassEffectView", "NSGraphicsContext", "NSColorSampler", "NSColorSpace", "NSCell"] }
raw-window-handle = "0.6.2"
block2 = "0.6.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow", "CGDirectDisplay", "CGError", "CGImage"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNDetectBarcodesRequest", "VNObservation", "VNTypes", "objc2-core-foundation"] }
notify = "8.2.1"
pinyin = { version = "0.11.0", default-features = false, features = ["plain", "heteronym"] }
plist = { version = "1.10.3", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.1", features = ["json"] }
security-framework = "3.7.0"
# 只为 readme-shots 打开 GPUI 的离屏渲染（与 gpui-kit 用的是同一版本）。
gpui-pre = { version = "=0.3.11", optional = true }
gpui-pre-macos = { version = "=0.3.11", optional = true }
# 实用工具（时间 / 开发者工具 / 取色）：时区换算、哈希、编码、UUID、色块图片、回主线程取色。
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
md-5 = "0.10"
sha1 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v7"] }
png = "0.18"
# MCP 客户端：只读导入 Codex 的 ~/.codex/config.toml。
toml = "1"
dispatch2 = "0.3"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[features]
# 截 README 配图：图形自检的 `snap:<名字>` 用 GPUI 的离屏渲染把面板存成 PNG（不需要屏幕录制权限）。
# 只给 `cargo build --release --features readme-shots` 用，发布包不带。
readme-shots = ["dep:gpui-pre", "gpui-pre/test-support", "dep:gpui-pre-macos", "gpui-pre-macos/test-support"]

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
