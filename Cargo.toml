[package]
name = "huan"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "唤 — a native macOS launcher with an agent switcher"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = "=0.9.0"
global-hotkey = "0.9.0"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSError", "NSDate", "NSDateFormatter", "NSFormatter", "NSLocale"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "objc2-core-foundation"] }
notify = "8.2.1"
pinyin = { version = "0.11.0", default-features = false, features = ["plain", "heteronym"] }
plist = { version = "1.10.3", default-features = false }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
