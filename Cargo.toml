[package]
name = "huan"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "唤 — a native macOS launcher with an agent switcher"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = "=0.9.0"
global-hotkey = "0.9.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6.2"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
