<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Helmp 设置 · 扩展</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.desk{position:relative;width:1280px;height:800px;overflow:hidden;background:#cdd6ea url(/_blob/6f3c6191bac858ee8bf10a413df4532e) center/cover no-repeat;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1d1d1f;font-size:13px;-webkit-font-smoothing:antialiased}
.win{position:absolute;left:220px;top:80px;width:840px;height:640px;display:flex;border-radius:18px;overflow:hidden;background:rgba(252,252,253,.94);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 30px 80px rgba(0,0,0,.28)}
.side{width:220px;margin:8px 0 8px 8px;padding:10px 8px;border-radius:14px;background:rgba(236,236,240,.7);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:8px;font-size:13px}
.nav.on{background:#0b63e5;color:#fff}
.ni{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px}
.grp{margin:0 0 18px;border-radius:12px;background:rgba(0,0,0,.035);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06);overflow:hidden}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 96px 46px;align-items:center;column-gap:10px;min-height:44px;padding:4px 14px}
.tr + .tr{border-top:1px solid rgba(0,0,0,.07)}
.th{min-height:30px;font-size:11.5px;font-weight:600;color:#6e6e73}
.help{color:#6e6e73;font-size:12px}
.gh{margin:0 0 6px 4px;font-size:13px;font-weight:600}
.sw{position:relative;width:38px;height:22px;border:0;padding:0;border-radius:11px;background:#0b63e5}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.k{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.07);color:#3a3a3c;font-size:11.5px;font-weight:500}
.ti{display:flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;border-radius:6px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.pb{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 10px;border:0;border-radius:6px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 1px 1.5px rgba(0,0,0,.08);font:inherit;font-size:13px;color:#1d1d1f}
</style>
</helmet>
<div class="desk">
  <div class="win">
    <nav class="side" aria-label="设置">
      <div style="display: flex; gap: 8px; padding: 2px 6px 14px">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; height: 28px; margin: 0 2px 10px; padding: 0 8px; border-radius: 7px; background: rgba(0,0,0,.06); color: #6e6e73">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.2"/><path d="m9.2 9.2 3.3 3.3"/></svg>搜索
      </div>
      <div class="nav"><span class="ni" style="background: #8e8e93"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke-linecap="round"/></svg></span>通用</div>
      <div class="nav on"><span class="ni" style="background: rgba(255,255,255,.25)"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h3V3.5a1.5 1.5 0 0 1 3 0V5h3v3h-1.5a1.5 1.5 0 0 0 0 3H12v3H3z"/></svg></span>扩展</div>
      <div class="nav"><span class="ni" style="background: #0a7f8a"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M6 1.5V4M10 1.5V4M6 12v2.5M10 12v2.5M1.5 6H4M1.5 10H4M12 6h2.5M12 10h2.5" stroke-linecap="round"/></svg></span>模型</div>
      <div class="nav"><span class="ni" style="background: #8944ab"><svg width="13" height="13" viewBox="0 0 16 16" fill="#fff" aria-hidden="true"><path d="M8 1.5 9.4 6.6 14.5 8 9.4 9.4 8 14.5 6.6 9.4 1.5 8l5.1-1.4z"/></svg></span>Agent</div>
      <div class="nav"><span class="ni" style="background: #e8790a"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2.5" width="10" height="12" rx="2"/><path d="M6 2.5h4v2H6z"/></svg></span>剪贴板</div>
      <div class="nav"><span class="ni" style="background: #5e5ce6"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 5V3.5A1.5 1.5 0 0 1 3.5 2H5M11 2h1.5A1.5 1.5 0 0 1 14 3.5V5M14 11v1.5a1.5 1.5 0 0 1-1.5 1.5H11M5 14H3.5A1.5 1.5 0 0 1 2 12.5V11"/></svg></span>截图</div>
      <div class="nav"><span class="ni" style="background: #1d1d1f"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="#fff"/></svg></span>外观</div>
      <div class="nav"><span class="ni" style="background: #8e8e93"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 7v4.5"/><circle cx="8" cy="4.6" r=".6" fill="#fff"/></svg></span>关于</div>
    </nav>

    <main style="flex: 1; min-width: 0; padding: 16px 28px 20px; overflow: hidden">
      <div style="height: 28px; display: flex; align-items: center; margin-bottom: 18px; font-size: 15px; font-weight: 700">扩展</div>

      <div class="grp">
        <div class="tr th"><span>名称</span><span>类型</span><span>别名</span><span>快捷键</span><span>启用</span></div>
        <div class="tr">
          <span style="display: flex; align-items: center; gap: 10px"><span class="ti" style="background: #0b63e5"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2"/></svg></span>应用搜索</span>
          <span class="help">内置</span><span class="help">—</span><span class="help">—</span>
          <button type="button" role="switch" aria-checked="true" aria-label="启用应用搜索" class="sw"></button>
        </div>
        <div class="tr">
          <span style="display: flex; align-items: center; gap: 10px"><span class="ti" style="background: #8944ab"><svg width="14" height="14" viewBox="0 0 16 16" fill="#fff" aria-hidden="true"><path d="M8 1.5 9.4 6.6 14.5 8 9.4 9.4 8 14.5 6.6 9.4 1.5 8l5.1-1.4z"/></svg></span>Agent 会话</span>
          <span class="help">内置</span><span class="mono">ag</span><span style="display: flex; gap: 3px"><span class="k">⌃</span><span class="k">⌥</span><span class="k">A</span></span>
          <button type="button" role="switch" aria-checked="true" aria-label="启用 Agent 会话" class="sw"></button>
        </div>
        <div class="tr">
          <span style="display: flex; align-items: center; gap: 10px"><span class="ti" style="background: #e8790a"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2.5" width="10" height="12" rx="2"/><path d="M6 2.5h4v2H6z"/></svg></span>剪贴板历史</span>
          <span class="help">内置</span><span class="mono">cb</span><span style="display: flex; gap: 3px"><span class="k">⌘</span><span class="k">⇧</span><span class="k">V</span></span>
          <button type="button" role="switch" aria-checked="true" aria-label="启用剪贴板历史" class="sw"></button>
        </div>
        <div class="tr">
          <span style="display: flex; align-items: center; gap: 10px"><span class="ti" style="background: #5e5ce6"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 5V3.5A1.5 1.5 0 0 1 3.5 2H5M11 2h1.5A1.5 1.5 0 0 1 14 3.5V5M14 11v1.5a1.5 1.5 0 0 1-1.5 1.5H11M5 14H3.5A1.5 1.5 0 0 1 2 12.5V11"/></svg></span>截图与文字识别</span>
          <span class="help">内置</span><span class="mono">jt</span><span style="display: flex; gap: 3px"><span class="k">⌘</span><span class="k">⇧</span><span class="k">2</span></span>
          <button type="button" role="switch" aria-checked="true" aria-label="启用截图与文字识别" class="sw"></button>
        </div>
        <div class="tr">
          <span style="display: flex; align-items: center; gap: 10px"><span class="ti" style="background: #0a7f8a"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5h6M5 2v1.5M3.5 3.5c.6 2.3 2 3.8 4 4.6M7 3.5c-.6 2.3-2 3.8-4.5 4.6"/><path d="m8.5 14 2.7-6.5L14 14M9.4 12h3.6"/></svg></span><span style="display: flex; flex-direction: column; gap: 1px"><span>翻译</span><span class="help">使用「模型」里配置的模型</span></span></span>
          <span class="help">内置</span><span class="mono">fy</span><span style="display: flex; gap: 3px"><span class="k">⌥</span><span class="k">⇧</span><span class="k">T</span></span>
          <button type="button" role="switch" aria-checked="true" aria-label="启用翻译" class="sw"></button>
        </div>
        <div class="tr">
          <span style="display: flex; align-items: center; gap: 10px"><span class="ti" style="background: #3a3a3c"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 5 3 3-3 3M8 11h5"/></svg></span><span style="display: flex; flex-direction: column; gap: 1px"><span>脚本命令</span><span class="help">已加载 855 个，6 个无法解析</span></span></span>
          <span class="help">脚本</span><span class="help">—</span><span class="help">—</span>
          <button type="button" role="switch" aria-checked="true" aria-label="启用脚本命令" class="sw"></button>
        </div>
      </div>

      <div class="gh">脚本目录</div>
      <div class="grp">
        <div class="tr" style="grid-template-columns: minmax(0, 1fr) auto"><span class="mono">~/Library/Application Support/Helmp/scripts</span><span class="help">3 个</span></div>
        <div class="tr" style="grid-template-columns: minmax(0, 1fr) auto; background: rgba(11,99,229,.1)"><span class="mono">~/code_hub/_ref/script-commands/commands</span><span class="help">852 个</span></div>
        <div style="display: flex; align-items: center; gap: 2px; height: 30px; padding: 0 8px; border-top: 1px solid rgba(0,0,0,.07)">
          <button type="button" aria-label="添加脚本目录" style="width: 26px; height: 22px; border: 0; border-radius: 5px; background: transparent; font: inherit; font-size: 16px; color: #3a3a3c">+</button>
          <button type="button" aria-label="移除所选目录" style="width: 26px; height: 22px; border: 0; border-radius: 5px; background: transparent; font: inherit; font-size: 16px; color: #3a3a3c">−</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" class="pb">从 Raycast 导入脚本…</button>
        <span class="help">兼容 Raycast Script Commands 的头注释格式</span>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
