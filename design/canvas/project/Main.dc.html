<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Helmp · 菜单栏与下拉菜单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.desk{position:relative;width:1280px;height:800px;overflow:hidden;background:#cdd6ea url(/_blob/6f3c6191bac858ee8bf10a413df4532e) center/cover no-repeat;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1d1d1f;font-size:13px;-webkit-font-smoothing:antialiased}
.glass{background:rgba(246,246,248,.76);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);box-shadow:0 0 0 .5px rgba(0,0,0,.16),inset 0 0 0 .5px rgba(255,255,255,.7),0 18px 50px rgba(0,0,0,.22)}
.mi{display:flex;align-items:center;gap:8px;height:24px;padding:0 10px;border-radius:6px;color:#1d1d1f}
.mi .sc{margin-left:auto;color:#6e6e73;font-size:13px;letter-spacing:.5px}
.mi.on{background:#0b63e5;color:#fff}
.mi.on .sc{color:rgba(255,255,255,.88)}
.gap{width:16px;flex:none}
.sep{height:1px;margin:5px 10px;background:rgba(0,0,0,.1)}
.lbl{padding:4px 10px 2px;font-size:11px;font-weight:600;color:#6e6e73}
</style>
</helmet>
<div class="desk">
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 30px; display: flex; align-items: center; gap: 18px; padding: 0 14px; background: rgba(255,255,255,.38); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); box-shadow: 0 .5px 0 rgba(0,0,0,.08); font-size: 13px">
    <span style="font-weight: 700">访达</span>
    <span>文件</span><span>编辑</span><span>显示</span><span>前往</span><span>窗口</span><span>帮助</span>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 16px">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1d1d1f" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="3" width="13" height="4" rx="2"/><rect x="1.5" y="9" width="13" height="4" rx="2"/><circle cx="5" cy="5" r="1.2" fill="#1d1d1f"/><circle cx="11" cy="11" r="1.2" fill="#1d1d1f"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M1.8 6.2a9 9 0 0 1 12.4 0"/><path d="M4 8.6a5.8 5.8 0 0 1 8 0"/><path d="M6.2 11a2.6 2.6 0 0 1 3.6 0"/><circle cx="8" cy="13" r=".8" fill="#1d1d1f"/></svg>
      <svg width="24" height="14" viewBox="0 0 24 14" fill="none" aria-hidden="true"><rect x=".75" y=".75" width="20" height="12.5" rx="3.5" stroke="#1d1d1f" stroke-opacity=".5" stroke-width="1.2"/><rect x="2.5" y="2.5" width="14" height="9" rx="2" fill="#1d1d1f"/><rect x="21.8" y="4.5" width="1.6" height="5" rx=".8" fill="#1d1d1f" fill-opacity=".5"/></svg>
      <button type="button" aria-label="Helmp，2 个会话在等你" style="position: relative; display: flex; align-items: center; justify-content: center; width: 30px; height: 22px; border: 0; border-radius: 6px; background: rgba(0,0,0,.12); padding: 0">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3v10M10.5 6.5V13M3.5 8h7" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/><path d="m12.6 1 .6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" fill="#1d1d1f"/></svg>
        <span style="position: absolute; right: 2px; top: 2px; width: 7px; height: 7px; border-radius: 50%; background: #ff8a00; box-shadow: 0 0 0 1.5px rgba(255,255,255,.9)"></span>
      </button>
      <span>11月8日 周六 13:45</span>
    </div>
  </div>

  <div class="glass" style="position: absolute; top: 34px; left: 862px; width: 300px; border-radius: 12px; padding: 5px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px 9px">
      <img src="/_blob/e5e5d765c84f233139f3950d6208d8c0" alt="" style="width: 32px; height: 32px; border-radius: 8px">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-weight: 600; font-size: 13px">Helmp</span>
        <span style="font-size: 12px; color: #a24600">2 个会话在等你</span>
      </div>
    </div>
    <div class="sep"></div>
    <div class="lbl">Agent 会话</div>
    <div class="mi"><img src="/_blob/491258cde129fd053b687aea4fa432f9" alt="" style="width: 16px; height: 16px">Finder daily radar<span class="sc" style="color: #a24600; letter-spacing: 0">等你确认</span></div>
    <div class="mi"><img src="/_blob/4e9eb3d0a2b93a22cf6cccaa782b2df3" alt="" style="width: 16px; height: 16px">Godot 框架调研<span class="sc" style="color: #a24600; letter-spacing: 0">等你回答</span></div>
    <div class="mi"><span class="gap"></span>全部会话…<span class="sc">⌥A</span></div>
    <div class="sep"></div>
    <div class="mi on"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg>打开 Helmp<span class="sc">⌥Space</span></div>
    <div class="mi"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1d1d1f" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2.5" width="10" height="12" rx="2"/><path d="M6 2.5h4v2H6z"/><path d="M5.5 8h5M5.5 10.5h3.5" stroke-linecap="round"/></svg>剪贴板历史<span class="sc">⌘⇧V</span></div>
    <div class="mi"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 5V3.5A1.5 1.5 0 0 1 3.5 2H5M11 2h1.5A1.5 1.5 0 0 1 14 3.5V5M14 11v1.5a1.5 1.5 0 0 1-1.5 1.5H11M5 14H3.5A1.5 1.5 0 0 1 2 12.5V11"/><path d="M5.5 6.5h5M5.5 9.5h3"/></svg>截图识别文字<span class="sc">⌘⇧2</span></div>
    <div class="mi"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1d1d1f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5h6M5 2v1.5M3.5 3.5c.6 2.3 2 3.8 4 4.6M7 3.5c-.6 2.3-2 3.8-4.5 4.6"/><path d="m8.5 14 2.7-6.5L14 14M9.4 12h3.6"/></svg>翻译选中文字<span class="sc">⌘⇧T</span></div>
    <div class="sep"></div>
    <div class="mi"><span class="gap"></span>设置…<span class="sc">⌘,</span></div>
    <div class="mi"><span class="gap"></span>检查更新…</div>
    <div class="sep"></div>
    <div class="mi"><span class="gap"></span>退出 Helmp<span class="sc">⌘Q</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>

</body>
</html>
