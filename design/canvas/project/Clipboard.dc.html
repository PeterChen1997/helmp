<style>
body{margin:0}
.desk{position:relative;width:1280px;height:800px;overflow:hidden;background:#cdd6ea url(/_blob/6f3c6191bac858ee8bf10a413df4532e) center/cover no-repeat;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1d1d1f;font-size:13px;-webkit-font-smoothing:antialiased}
.glass{background:rgba(246,246,248,.74);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);box-shadow:0 0 0 .5px rgba(0,0,0,.16),inset 0 0 0 .5px rgba(255,255,255,.7),0 24px 70px rgba(0,0,0,.24)}
.panel{position:absolute;left:200px;top:130px;width:880px;height:540px;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;height:60px;flex:none;padding:0 20px;border-bottom:1px solid rgba(0,0,0,.08)}
.q{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:20px;color:#1d1d1f}
.scope{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:7px;background:rgba(232,121,10,.14);color:#8a3b00;font-weight:600;white-space:nowrap}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg{display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);font-size:12px}
.seg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:transparent;font:inherit;color:#3a3a3c}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600;color:#1d1d1f}
.body{flex:1;display:flex;min-height:0}
.side{width:380px;flex:none;padding:4px 8px;overflow:hidden;border-right:1px solid rgba(0,0,0,.08)}
.detail{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;padding:22px 26px;overflow:hidden}
.sec{padding:10px 12px 4px;font-size:12px;font-weight:600;color:#6e6e73}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 10px;border-radius:10px}
.row.on{background:#0b63e5;color:#fff}
.two{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:#6e6e73;font-size:12px}
.row.on .sub{color:rgba(255,255,255,.88)}
.ty{display:flex;align-items:center;justify-content:center;flex:none;width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.05);overflow:hidden}
.row.on .ty{background:rgba(255,255,255,.2)}
.k{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.07);color:#3a3a3c;font-size:11.5px;font-weight:500}
.foot{display:flex;align-items:center;gap:16px;height:40px;flex:none;padding:0 14px 0 16px;border-top:1px solid rgba(0,0,0,.08);font-size:12px;color:#48484a}
.ctx{display:flex;align-items:center;gap:6px;font-weight:600}
.hint{display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);row-gap:8px;margin:0;font-size:12.5px}
.kv dt{color:#6e6e73}
.kv dd{margin:0}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px}
</style>
</helmet>
