<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Helmp 设置 · 模型</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.desk{position:relative;width:1280px;height:800px;overflow:hidden;background:#cdd6ea url(/_blob/6f3c6191bac858ee8bf10a413df4532e) center/cover no-repeat;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1d1d1f;font-size:13px;-webkit-font-smoothing:antialiased}
.win{position:absolute;left:220px;top:50px;width:840px;height:700px;display:flex;border-radius:18px;overflow:hidden;background:rgba(252,252,253,.94);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 30px 80px rgba(0,0,0,.28)}
.side{width:220px;margin:8px 0 8px 8px;padding:10px 8px;border-radius:14px;background:rgba(236,236,240,.7);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:8px;font-size:13px}
.nav.on{background:#0b63e5;color:#fff}
.ni{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px}
.grp{margin:0 0 14px;border-radius:12px;background:rgba(0,0,0,.035);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06);overflow:hidden}
.r{display:flex;align-items:center;gap:12px;min-height:40px;padding:4px 14px}
.r + .r{border-top:1px solid rgba(0,0,0,.07)}
.help{color:#6e6e73;font-size:12px;line-height:1.45}
.gh{margin:0 0 6px 4px;font-size:13px;font-weight:600}
.pop{display:inline-flex;align-items:center;gap:8px;height:24px;margin-left:auto;padding:0 6px 0 10px;border:0;border-radius:6px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 1px 1.5px rgba(0,0,0,.08);font:inherit;font-size:13px;color:#1d1d1f;white-space:nowrap}
.fld{width:300px;height:24px;margin-left:auto;padding:0 8px;border:0;border-radius:6px;background:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2);font:inherit;font-size:13px;color:#1d1d1f;outline:0}
.lt{display:flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;border-radius:7px;font-size:13px;font-weight:700;color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;margin-left:auto;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px}
</style>
</helmet>
<div class="desk">
  <div class="win">
    <nav class="side" aria-label="设置">
      <div style="display: flex; gap: 8px; padding: 2px 6px 14px">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; height: 28px; margin: 0 2px 10px; padding: 0 8px; border-radius: 7px; background: rgba(0,0,0,.06); color: #6e6e73">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.2"/><path d="m9.2 9.2 3.3 3.3"/></svg>搜索
      </div>
      <div class="nav"><span class="ni" style="background: #8e8e93"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke-linecap="round"/></svg></span>通用</div>
      <div class="nav"><span class="ni" style="background: #0b63e5"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h3V3.5a1.5 1.5 0 0 1 3 0V5h3v3h-1.5a1.5 1.5 0 0 0 0 3H12v3H3z"/></svg></span>扩展</div>
      <div class="nav on"><span class="ni" style="background: rgba(255,255,255,.25)"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M6 1.5V4M10 1.5V4M6 12v2.5M10 12v2.5M1.5 6H4M1.5 10H4M12 6h2.5M12 10h2.5" stroke-linecap="round"/></svg></span>模型</div>
      <div class="nav"><span class="ni" style="background: #8944ab"><svg width="13" height="13" viewBox="0 0 16 16" fill="#fff" aria-hidden="true"><path d="M8 1.5 9.4 6.6 14.5 8 9.4 9.4 8 14.5 6.6 9.4 1.5 8l5.1-1.4z"/></svg></span>Agent</div>
      <div class="nav"><span class="ni" style="background: #e8790a"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2.5" width="10" height="12" rx="2"/><path d="M6 2.5h4v2H6z"/></svg></span>剪贴板</div>
      <div class="nav"><span class="ni" style="background: #5e5ce6"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 5V3.5A1.5 1.5 0 0 1 3.5 2H5M11 2h1.5A1.5 1.5 0 0 1 14 3.5V5M14 11v1.5a1.5 1.5 0 0 1-1.5 1.5H11M5 14H3.5A1.5 1.5 0 0 1 2 12.5V11"/></svg></span>截图</div>
      <div class="nav"><span class="ni" style="background: #1d1d1f"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="#fff"/></svg></span>外观</div>
      <div class="nav"><span class="ni" style="background: #8e8e93"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 7v4.5"/><circle cx="8" cy="4.6" r=".6" fill="#fff"/></svg></span>关于</div>
    </nav>

    <main style="flex: 1; min-width: 0; padding: 16px 28px 20px; overflow: hidden">
      <div style="height: 28px; display: flex; align-items: center; margin-bottom: 6px; font-size: 15px; font-weight: 700">模型</div>
      <p class="help" style="margin: 0 0 14px; font-size: 12.5px">Helmp 不自带模型，也不经过任何中转。接入你自己的 API Key 或本机模型，用于翻译等功能；Key 只存在本机钥匙串里。</p>

      <div class="gh">已接入</div>
      <div class="grp">
        <div class="r" style="min-height: 46px">
          <span class="lt" style="background: #c96442">A</span>
          <span style="display: flex; flex-direction: column; gap: 1px"><span>Claude Haiku 5.5</span><span class="help">Anthropic · claude-haiku-5-5</span></span>
          <span class="chip" style="background: rgba(11,99,229,.12); color: #0a4fb8">默认</span>
        </div>
        <div class="r" style="min-height: 46px; background: rgba(11,99,229,.1)">
          <span class="lt" style="background: #4d6bfe">D</span>
          <span style="display: flex; flex-direction: column; gap: 1px"><span>DeepSeek</span><span class="help">OpenAI 兼容接口 · deepseek-chat</span></span>
        </div>
        <div class="r" style="min-height: 46px">
          <span class="lt" style="background: #3a3a3c">O</span>
          <span style="display: flex; flex-direction: column; gap: 1px"><span>Qwen3 8B</span><span class="help">Ollama · 本机 localhost:11434</span></span>
          <span class="chip" style="background: #dcf2e1; color: #1c6b30"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1f8a3b"></span>在线</span>
        </div>
        <div style="display: flex; align-items: center; gap: 2px; height: 28px; padding: 0 8px; border-top: 1px solid rgba(0,0,0,.07)">
          <button type="button" aria-label="添加模型" style="width: 26px; height: 22px; border: 0; border-radius: 5px; background: transparent; font: inherit; font-size: 16px; color: #3a3a3c">+</button>
          <button type="button" aria-label="移除所选模型" style="width: 26px; height: 22px; border: 0; border-radius: 5px; background: transparent; font: inherit; font-size: 16px; color: #3a3a3c">−</button>
        </div>
      </div>

      <div class="gh">DeepSeek</div>
      <div class="grp">
        <div class="r"><span>接口类型</span><button type="button" class="pop" aria-haspopup="listbox">OpenAI 兼容<svg width="9" height="12" viewBox="0 0 9 12" fill="none" stroke="#3a3a3c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 4.5 2.5-2.5L7 4.5M2 7.5 4.5 10 7 7.5"/></svg></button></div>
        <div class="r"><label for="base">Base URL</label><input id="base" class="fld mono" value="https://api.deepseek.com/v1"></div>
        <div class="r"><label for="key">API Key</label><input id="key" class="fld" type="password" value="sk-0000000000000000"></div>
        <div class="r"><label for="model">模型名</label><input id="model" class="fld mono" value="deepseek-chat"></div>
        <div class="r">
          <span class="help" style="display: flex; align-items: center; gap: 6px; color: #1c6b30"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#1c6b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7.5 2.7 2.7L11 4.5"/></svg>连接正常 · Key 已存入钥匙串</span>
          <button type="button" class="pop" style="padding: 0 10px">测试连接</button>
        </div>
      </div>

      <div class="gh">用途</div>
      <div class="grp">
        <div class="r"><span>翻译</span><button type="button" class="pop" aria-haspopup="listbox">Claude Haiku 5.5<svg width="9" height="12" viewBox="0 0 9 12" fill="none" stroke="#3a3a3c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 4.5 2.5-2.5L7 4.5M2 7.5 4.5 10 7 7.5"/></svg></button></div>
        <div class="r"><span>翻译默认目标语言</span><button type="button" class="pop" aria-haspopup="listbox">中英互译（自动）<svg width="9" height="12" viewBox="0 0 9 12" fill="none" stroke="#3a3a3c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 4.5 2.5-2.5L7 4.5M2 7.5 4.5 10 7 7.5"/></svg></button></div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>

</script>
</body>
</html>
