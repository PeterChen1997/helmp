<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Helmp · 主面板首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.desk{position:relative;width:1280px;height:800px;overflow:hidden;background:#cdd6ea url(/_blob/6f3c6191bac858ee8bf10a413df4532e) center/cover no-repeat;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1d1d1f;font-size:13px;-webkit-font-smoothing:antialiased}
.glass{background:rgba(246,246,248,.74);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);box-shadow:0 0 0 .5px rgba(0,0,0,.16),inset 0 0 0 .5px rgba(255,255,255,.7),0 24px 70px rgba(0,0,0,.24)}
.panel{position:absolute;left:200px;top:130px;width:880px;height:540px;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;height:60px;flex:none;padding:0 20px;border-bottom:1px solid rgba(0,0,0,.08)}
.q{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:20px;color:#1d1d1f}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.list{flex:1;min-height:0;padding:4px 8px;overflow:hidden}
.sec{padding:10px 12px 4px;font-size:12px;font-weight:600;color:#6e6e73}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-radius:10px}
.row.on{background:#0b63e5;color:#fff}
.t{font-weight:600}
.acc{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6e6e73;font-size:12px;white-space:nowrap}
.row.on .acc{color:rgba(255,255,255,.88)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.wait{background:#ffe7c7;color:#8a3b00}
.row.on .chip{background:rgba(255,255,255,.24);color:#fff}
.k{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.07);color:#3a3a3c;font-size:11.5px;font-weight:500}
.sym{display:flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;border-radius:7px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;width:104px;padding:8px 0 6px;border-radius:12px;font-size:12px}
.foot{display:flex;align-items:center;gap:16px;height:40px;flex:none;padding:0 14px 0 16px;border-top:1px solid rgba(0,0,0,.08);font-size:12px;color:#48484a}
.ctx{display:flex;align-items:center;gap:6px;font-weight:600}
.hint{display:flex;align-items:center;gap:6px}
</style>
</helmet>
<div class="desk">
  <div class="glass panel">
    <div class="bar">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#6e6e73" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9.5" cy="9.5" r="6.5"/><path d="m14.5 14.5 5 5"/></svg>
      <label for="q" class="vh">搜索</label>
      <input id="q" class="q" placeholder="搜索应用、Agent 会话、剪贴板、命令…">
    </div>

    <div class="list">
      <div class="sec">等你处理</div>
      <div class="row on">
        <img src="/_blob/491258cde129fd053b687aea4fa432f9" alt="" style="width: 28px; height: 28px">
        <span class="t">Finder daily radar</span>
        <span class="chip wait">等你确认权限</span>
        <span class="acc">~/code_hub/finder · 10 分钟前</span>
      </div>
      <div class="row">
        <img src="/_blob/4e9eb3d0a2b93a22cf6cccaa782b2df3" alt="" style="width: 28px; height: 28px">
        <span class="t">Godot 框架调研</span>
        <span class="chip wait">等你回答</span>
        <span class="acc">~/code_hub/game · 1 小时前</span>
      </div>

      <div class="sec">最近使用</div>
      <div style="display: flex; gap: 6px; padding: 0 4px">
        <div class="tile"><img src="/_blob/931b533add3d07079270a100374d7818" alt="" style="width: 44px; height: 44px">微信</div>
        <div class="tile"><img src="/_blob/b770defa093d7a2f2fd67c0e01f8dd91" alt="" style="width: 44px; height: 44px">飞书</div>
        <div class="tile"><img src="/_blob/80a6d3459e1c1377b3c9e11080dd5485" alt="" style="width: 44px; height: 44px">Safari</div>
        <div class="tile"><img src="/_blob/ef9ea4f80d5ca0e11a3f3f74bf97263d" alt="" style="width: 44px; height: 44px">Zed</div>
        <div class="tile"><img src="/_blob/8076e6c2a818891fdc445259e6e5f0d4" alt="" style="width: 44px; height: 44px">终端</div>
      </div>

      <div class="sec">快捷命令</div>
      <div class="row">
        <span class="sym" style="background: #5e5ce6"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 5V3.5A1.5 1.5 0 0 1 3.5 2H5M11 2h1.5A1.5 1.5 0 0 1 14 3.5V5M14 11v1.5a1.5 1.5 0 0 1-1.5 1.5H11M5 14H3.5A1.5 1.5 0 0 1 2 12.5V11"/><path d="M5.5 6.5h5M5.5 9.5h3"/></svg></span>
        <span>截图识别文字</span>
        <span class="acc"><span class="k">⌘</span><span class="k">⇧</span><span class="k">2</span></span>
      </div>
      <div class="row">
        <span class="sym" style="background: #0a7f8a"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5h6M5 2v1.5M3.5 3.5c.6 2.3 2 3.8 4 4.6M7 3.5c-.6 2.3-2 3.8-4.5 4.6"/><path d="m8.5 14 2.7-6.5L14 14M9.4 12h3.6"/></svg></span>
        <span>翻译</span>
        <span class="acc"><span class="k">⌥</span><span class="k">⇧</span><span class="k">T</span></span>
      </div>
      <div class="row">
        <span class="sym" style="background: #e8790a"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2.5" width="10" height="12" rx="2"/><path d="M6 2.5h4v2H6z"/><path d="M5.5 8h5M5.5 10.5h3.5" stroke-linecap="round"/></svg></span>
        <span>剪贴板历史</span>
        <span class="acc"><span class="k">⌘</span><span class="k">⇧</span><span class="k">V</span></span>
      </div>
    </div>

    <div class="foot">
      <span class="ctx"><img src="/_blob/e5e5d765c84f233139f3950d6208d8c0" alt="" style="width: 16px; height: 16px; border-radius: 4px">Helmp</span>
      <span class="hint" style="margin-left: auto">跳转到会话<span class="k">↵</span></span>
      <span class="hint">操作<span class="k">⌘K</span></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
